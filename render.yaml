# Render Blueprint — matches the deployment topology in docs/architecture/deployment.md:
# a Web Service for the Express API, a Static Site for the built Vite/React app, and a
# managed PostgreSQL database. PITR (point-in-time recovery) must be enabled on the database
# via the Render dashboard/plan tier — it is not configurable from this blueprint file.
#
# Environment variables marked `sync: false` must be set manually in the Render dashboard
# (secrets are never committed to this file or to source control).

databases:
  - name: payroll-postgres
    plan: standard
    databaseName: payroll
    user: payroll

services:
  - type: web
    name: payroll-backend
    runtime: node
    plan: starter
    rootDir: backend
    # `rootDir: backend` means this whole command starts with `backend/` as cwd, so it opens with
    # `cd ..` to reach the real workspace root before doing anything workspace-wide — see
    # docs/architecture/deployment.md's "Backend Build Command (Render)" section for why each step
    # here is necessary (this replaced an earlier version that looked reasonable but silently
    # failed from a clean checkout in three separate ways, none of them Puppeteer-related):
    #   1. `npm ci` (not `npm install --workspaces=false`) — a real workspace-aware install run
    #      from the actual repo root. `--workspaces=false` cannot resolve `@payroll/shared`, an
    #      unpublished workspace-only package with no existence on the npm registry.
    #   2. `npm run build:shared` — `@payroll/shared`'s compiled `dist/` must exist before `tsc`
    #      compiles `backend`, which imports it by package name through the workspace symlink.
    #   3. `npm run prisma:generate` — `@prisma/client`'s own postinstall (which already ran as
    #      part of step 1) cannot reliably locate `backend/prisma/schema.prisma` from its hoisted
    #      install location and silently generates a placeholder client with no real models. This
    #      step regenerates the real one, explicitly, from the correct schema.
    #   4. `npm run build:backend` — compiles the backend, now that both of its build-time
    #      dependencies (steps 2 and 3) are actually correct.
    #   5. `cd backend && npx puppeteer browsers install chrome` — the Puppeteer fix itself,
    #      unchanged: provisions the pinned Chrome build into the project-local cache directory
    #      `backend/.puppeteerrc.cjs` points at. Needs `backend/` as its own cwd (not just as an
    #      ancestor reached via `--prefix`) for that file to be discovered — see its own comment.
    buildCommand: cd .. && npm ci && npm run build:shared && npm run prisma:generate && npm run build:backend && cd backend && npx puppeteer browsers install chrome
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: payroll-postgres
          property: connectionString
      - key: SESSION_SECRET
        sync: false
      - key: CSRF_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: PORT
        value: 4000
      # Phase 7C — Company Logo storage. The R2_* credentials are provisioned manually in the
      # Render dashboard (sync: false, same as SESSION_SECRET/CSRF_SECRET above); this blueprint
      # only declares that they exist and flips STORAGE_PROVIDER to select R2 in production. Local
      # dev/test keeps STORAGE_PROVIDER="local" (backend/.env.example's own default) — unaffected.
      - key: STORAGE_PROVIDER
        value: r2
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_ENDPOINT
        sync: false

  - type: web
    name: payroll-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
