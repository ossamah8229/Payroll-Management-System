services:
  postgres:
    image: postgres:16-alpine
    container_name: payroll-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: payroll
      POSTGRES_PASSWORD: payroll_dev_password
      POSTGRES_DB: payroll_dev
    ports:
      - '5432:5432'
    volumes:
      - payroll_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U payroll -d payroll_dev']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  payroll_postgres_data:
